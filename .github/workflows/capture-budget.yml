name: Store the verified demo screenshot
on:
  push:
    branches: [docs/capture-released-budget]
permissions: {}
jobs:
  save-image:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: write
    steps:
      - name: Store the published v0.1.0 demo image as a Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45944908829 --repo finance-lab-project/finance-lab --name released-budget-screenshot
          file march-budget.png | grep 'PNG image data'
          base64 -w0 march-budget.png | jq -Rs '{content: ., encoding: "base64"}' |
            gh api --method POST repos/finance-lab-project/finance-lab/git/blobs --input - --jq '.sha'
