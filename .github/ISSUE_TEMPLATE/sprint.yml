name: Sprint work
description: Authorize the Mac worker to deliver a Finance Lab change.
body:
  - type: input
    id: start
    attributes:
      label: Sprint start (Moscow)
      description: Work can begin on this date.
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: User outcome
      description: Describe what the user should be able to do.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance examples
      description: Give an input, expected result, and an edge case the reviewer can verify.
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: Dependencies
      description: 'List prerequisite issues as #38, #39. Leave blank if there are none.'
