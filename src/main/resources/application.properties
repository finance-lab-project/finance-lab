spring.application.name=finance-lab
server.address=${BUDGET_BIND:127.0.0.1}
spring.datasource.url=jdbc:sqlite:${BUDGET_DB:./march-budget.sqlite}
spring.datasource.hikari.data-source-properties.foreign_keys=true
spring.datasource.hikari.data-source-properties.busy_timeout=5000
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/init/schema.sql
spring.sql.init.data-locations=classpath:sql/init/data.sql
budget.owner-a-password=${BUDGET_OWNER_A_PASSWORD}
budget.owner-b-password=${BUDGET_OWNER_B_PASSWORD}
