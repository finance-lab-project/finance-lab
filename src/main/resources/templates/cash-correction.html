<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="field">
    <label th:if="${cash != null and cash.date().getDayOfMonth() > 1 and cash.date().getYear() == period.getYear()
                    and cash.date().getMonthValue() == period.getMonthValue()}" for="correctionDate">
        Дата исправления до сверки <span th:text="${cash.date()}"></span> (если применимо)
        <input id="correctionDate" name="correctionDate" type="date" data-saved=""
               th:min="${period.atDay(1)}" th:max="${cash.date().minusDays(1)}" th:value="${draft['correctionDate']}">
    </label>
    <p th:if="${errors['correctionDate']}" class="notice error" role="alert" th:text="${errors['correctionDate']}"></p>
</th:block>
